<body class="admin">
<header class="a-top">
  <a class="a-logo" href="index.html"><img src="brand/logo-160.webp" alt="" width="40" height="40">LoopLove</a>
  <a class="a-back" href="index.html">Back to shop</a>
  <a class="a-back" href="profile.html">Your details</a>
  <span class="a-user" id="o-email"></span>
  <button class="theme-btn" type="button" data-theme-toggle aria-label="Switch to night mode"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>

<main class="a-main o-main">
  <section class="a-gate" id="o-gate">
    <h1>Your orders</h1>
    <p>Sign in with Google to see and track your orders.</p>
    <p class="error" id="o-gate-msg" role="alert"></p>
    <button class="btn solid" id="o-signin" type="button">Continue with Google</button>
  </section>

  <div id="o-app" hidden>
    <h1 class="p-title">Your orders</h1>
    <p class="muted o-intro">Every order updates here as soon as we move it along.</p>
    <ul class="o-list" id="o-list"></ul>
  </div>
</main>

<script type="module" src="js/orders.js?v=11"></script>
