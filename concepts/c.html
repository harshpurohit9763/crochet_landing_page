<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fingo concept C</title>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Mukta:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --night: #2A0E2E; --peacock: #0B4F4A; --gold: #F2A71B; --milk: #FFF3DC; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--night); color: var(--milk); font: 400 18px/1.5 'Mukta', sans-serif; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
img { display: block; width: 100%; }
.toran { height: 26px; background: radial-gradient(circle at 26px 0, var(--gold) 25px, transparent 26px) 0 0 / 52px 26px repeat-x; }
.nav { display: flex; justify-content: space-between; align-items: center; padding: 14px clamp(16px, 4vw, 48px); }
.nav div { display: flex; gap: 26px; }
.logo { font: 400 40px/1 'Yeseva One', serif; color: var(--gold); }
.hero { position: relative; text-align: center; padding: 0 16px; overflow: hidden; }
h1 { font: 400 clamp(46px, 7.6vw, 112px)/1.02 'Yeseva One', serif; position: relative; z-index: 2; }
.lede { margin: 12px auto 22px; max-width: 46ch; font-size: 20px; position: relative; z-index: 2; }
.btn { position: relative; z-index: 4; display: inline-block; padding: 13px 34px; border-radius: 99px; background: var(--gold); color: var(--night); font-weight: 500; transition: transform .2s; }
.btn:hover { transform: scale(1.05); }
.arches { display: flex; justify-content: center; align-items: flex-end; gap: clamp(10px, 2vw, 26px); margin-top: 36px; }
.arch { flex: 0 1 300px; overflow: hidden; border-radius: 999px 999px 0 0; border: 5px solid var(--gold); border-bottom: 0; transition: transform .3s ease-out; }
.arch img { aspect-ratio: 3 / 4; object-fit: cover; }
.arch.mid { flex-basis: 370px; }
.sec { background: var(--peacock); padding: clamp(56px, 8vw, 100px) clamp(16px, 4vw, 48px); }
h2 { font: 400 clamp(36px, 5vw, 66px)/1.05 'Yeseva One', serif; text-align: center; margin-bottom: 40px; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px 20px; max-width: 1240px; margin: 0 auto; }
.item { text-align: center; }
.item figure { border-radius: 999px 999px 18px 18px; overflow: hidden; }
.item img { aspect-ratio: 4 / 5; object-fit: cover; transition: transform .5s; }
.item:hover img { transform: scale(1.06); }
.item p { margin-top: 10px; font-weight: 500; }
.add { margin-top: 6px; padding: 7px 24px; border: 2px solid var(--gold); border-radius: 99px; background: none; color: var(--gold); font: inherit; font-weight: 500; cursor: pointer; transition: background .2s, color .2s; }
.add:hover { background: var(--gold); color: var(--night); }
@media (max-width: 800px) {
  .nav div a:nth-child(-n+2) { display: none; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .arch:not(.mid) { flex-basis: 26%; }
  .arch.mid { flex-basis: 42%; }
}
</style>
</head>
<body>
<div class="toran" aria-hidden="true"></div>
<nav class="nav"><a class="logo" href="#">fingo</a><div><a href="#">Shop</a><a href="#">Festive</a><a href="#">Basket (0)</a></div></nav>
<header class="hero" id="h">
  <h1 id="t">Little loops. Big happiness.</h1>
  <p class="lede">Handmade crochet for every festival, gift and everyday joy.</p>
  <a class="btn" href="#">Shop the collection</a>
  <div class="arches" id="arches">
    <div class="arch" data-d="10"><img src="../img/photo/a_lotus.webp" alt="Pink crochet lotus"></div>
    <div class="arch mid" data-d="-16"><img src="../img/photo/a_diya.webp" alt="Crochet lotus diya held in a hand"></div>
    <div class="arch" data-d="10"><img src="../img/photo/a_toran.webp" alt="Red crochet blossom toran"></div>
  </div>
</header>
<section class="sec">
  <h2>Loved at every celebration</h2>
  <div class="grid">
    <article class="item"><figure><img src="../img/product/gajra.webp" alt="Jasmine gajra"></figure><p>Jasmine gajra</p><button class="add">Add</button></article>
    <article class="item"><figure><img src="../img/product/rosebangle.webp" alt="Rose and moss bangles"></figure><p>Rose and moss bangles</p><button class="add">Add</button></article>
    <article class="item"><figure><img src="../img/product/sunbangle.webp" alt="Sunflower bangles"></figure><p>Sunflower bangles</p><button class="add">Add</button></article>
    <article class="item"><figure><img src="../img/product/daisy.webp" alt="Daisy keychain"></figure><p>Daisy keychain</p><button class="add">Add</button></article>
  </div>
</section>
<script src="shared.js"></script>
<script>
var arches = [].slice.call(document.querySelectorAll('.arch'));
addEventListener('pointermove', function (e) {
  var k = e.clientX / innerWidth - .5;
  arches.forEach(function (a) { a.style.transform = 'translateX(' + k * a.dataset.d + 'px)'; });
}, { passive: true });
fingoYarn({ host: document.getElementById('h'), from: document.getElementById('t'), fx: .5, fy: 1, rest: [.82, .3], color: '#F2A71B', w: 4 });
</script>
</body>
</html>
