<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fingo concept A</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --ink: #1E2B12; --line: #DCDFD6; --rose: #D81F68; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #fff; color: var(--ink); font: 400 17px/1.55 'Hanken Grotesk', sans-serif; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
img { display: block; width: 100%; }
.nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 20px clamp(16px, 4vw, 48px); border-bottom: 1px solid var(--line); }
.nav div { display: flex; gap: 28px; font-size: 16px; }
.nav div:last-child { justify-content: flex-end; }
.logo { font: italic 400 38px/1 'Bodoni Moda', serif; }
.hero { position: relative; display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100svh - 80px); }
.copy { display: flex; flex-direction: column; justify-content: flex-end; padding: clamp(24px, 4vw, 48px); }
h1 { font: 400 clamp(58px, 8.4vw, 128px)/.98 'Bodoni Moda', serif; letter-spacing: -.02em; }
.copy p { max-width: 38ch; margin: 24px 0 28px; font-size: 19px; }
.btn { align-self: flex-start; padding: 15px 34px; background: var(--ink); color: #fff; border-radius: 2px; font-weight: 500; transition: background .2s; }
.btn:hover { background: var(--rose); }
.photo { position: relative; overflow: hidden; }
.photo img { height: 100%; object-fit: cover; position: absolute; inset: 0; }
.row { padding: clamp(56px, 8vw, 110px) clamp(16px, 4vw, 48px); }
.head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 32px; }
h2 { font: 400 clamp(36px, 4.6vw, 62px)/1 'Bodoni Moda', serif; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px 20px; }
.item img { aspect-ratio: 4 / 5; object-fit: cover; }
.meta { display: flex; justify-content: space-between; gap: 10px; padding-top: 12px; }
.meta button { font: inherit; font-weight: 500; background: none; border: 0; border-bottom: 1px solid currentColor; cursor: pointer; color: inherit; }
.meta button:hover { color: var(--rose); }
@media (max-width: 800px) {
  .hero { grid-template-columns: 1fr; }
  .photo { height: 62vw; min-height: 300px; order: -1; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .nav div:first-child a:nth-child(n+2) { display: none; }
}
</style>
</head>
<body>
<nav class="nav"><div><a href="#">Shop</a><a href="#">Festive</a><a href="#">Our story</a></div><a class="logo" href="#">fingo</a><div><a href="#">Basket (0)</a></div></nav>
<header class="hero" id="h">
  <div class="copy">
    <h1 id="t">Little loops. Big happiness.</h1>
    <p>Crochet flowers, jewellery and festive pieces, each one made by hand.</p>
    <a class="btn" href="#">Shop the collection</a>
  </div>
  <div class="photo"><img src="../img/product/stem.webp" alt="Crochet sunflower on a long stem in a vase"></div>
</header>
<section class="row">
  <div class="head"><h2>Most loved</h2><a href="#">View all</a></div>
  <div class="grid">
    <article class="item"><img src="../img/product/cupcake.webp" alt="Cupcake keychain"><div class="meta"><span>Cupcake keychain</span><button>Add</button></div></article>
    <article class="item"><img src="../img/product/gajra.webp" alt="Jasmine gajra"><div class="meta"><span>Jasmine gajra</span><button>Add</button></div></article>
    <article class="item"><img src="../img/product/cherry.webp" alt="Cherry keychain"><div class="meta"><span>Cherry keychain</span><button>Add</button></div></article>
    <article class="item"><img src="../img/product/rosebangle.webp" alt="Rose and moss bangles"><div class="meta"><span>Rose and moss bangles</span><button>Add</button></div></article>
  </div>
</section>
<script src="shared.js"></script>
<script>fingoYarn({ host: document.getElementById('h'), from: document.getElementById('t'), fx: .62, fy: .98, rest: [.44, .9], color: '#D81F68', w: 4 });</script>
</body>
</html>
